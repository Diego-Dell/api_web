services:
  - type: web
    name: vetlink-apiweb
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        sync: false # Asignar en el panel de Render la Connection String provista por Supabase
